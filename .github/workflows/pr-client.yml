name: pr-client

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "packages/ui-web/**"
      - "packages/ui-mobile/**"
      - "packages/design-tokens/**"

permissions: {}

concurrency:
  group: pr-client-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  client:
    name: Client quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle check
        run: pnpm bundle:check

      - name: Accessibility check
        run: pnpm a11y