name: pr-ai-eval

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/ai/**"
      - "packages/retrieval/**"
      - "evals/**"

permissions: {}

concurrency:
  group: pr-ai-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-eval:
    name: AI evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d63268305364d27d6d9c34b2079f598444040856

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI evaluation suite
        run: pnpm eval:ai