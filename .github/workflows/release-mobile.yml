name: release-mobile

on:
  workflow_dispatch:

permissions: {}

jobs:
  freeze:
    uses: ./.github/workflows/freeze-check.yml

  release-mobile:
    name: Mobile release contract
    needs: freeze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d63268305364d27d6d9c34b2079f598444040856

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile workspace
        run: pnpm typecheck

      - name: Mobile release requires device matrix
        run: |
          echo "Device matrix provider action must be configured with approved pinned action SHA before release."
          exit 1