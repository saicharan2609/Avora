name: release-mobile

on:
  workflow_dispatch:

permissions: {}

jobs:
  freeze:
    uses: ./.github/workflows/freeze-check.yml

  release-mobile:
    name: Mobile release contract
    needs: freeze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile workspace
        run: pnpm typecheck

      - name: Mobile release requires device matrix
        run: |
          echo "Device matrix provider action must be configured with approved pinned action SHA before release."
          exit 1