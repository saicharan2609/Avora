name: pr-database

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "packages/db/**"
      - "packages/domain/**/repositories/**"

permissions: {}

concurrency:
  group: pr-database-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  database:
    name: Database gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d63268305364d27d6d9c34b2079f598444040856

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Database lint
        run: pnpm db:lint

      - name: Database diff
        run: pnpm db:diff

      - name: RLS negative-authorisation suite
        run: pnpm test:rls

      - name: Integration tests
        run: pnpm test:integration