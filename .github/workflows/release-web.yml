name: release-web

on:
  workflow_dispatch:

permissions: {}

jobs:
  freeze:
    uses: ./.github/workflows/freeze-check.yml

  release-web:
    name: Web release contract
    needs: freeze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build