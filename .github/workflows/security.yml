name: security

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d63268305364d27d6d9c34b2079f598444040856
        with:
          fetch-depth: 0

      - name: Secret scanning contract
        run: |
          git grep -n "SUPABASE_SERVICE_ROLE_KEY=" -- . ':!packages/config/env/schema.contract.ts' && exit 1 || true
          git grep -n "BEGIN .*PRIVATE KEY" -- . && exit 1 || true

  dependencies:
    name: Dependency scan contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level critical

  codeql:
    name: CodeQL contract
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38

  sbom:
    name: SBOM contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify lockfile exists
        run: test -f pnpm-lock.yaml