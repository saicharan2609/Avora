name: pr-adaptivity

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: pr-adaptivity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adaptivity:
    name: Structural adaptivity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Structural adaptivity suite
        run: pnpm test:adaptivity